name: Construir App Oficial (Google Play AAB y APK)

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: 📥 Clonar repositorio
      uses: actions/checkout@v4

    - name: ⚙️ Configurar Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: 📦 Instalar Motor Capacitor
      run: npm install

    - name: 🤖 Generar Proyecto Android
      run: |
        npx cap add android
        npx cap sync android

    - name: 🎨 Recortar e Inyectar Ícono Personalizado
      run: |
        npm install @capacitor/assets -D
        npx capacitor-assets generate --android

    - name: ☕ Configurar Java
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: 📷 Inyectar Permisos de Cámara
      run: |
        sed -i '/<uses-permission android:name="android.permission.INTERNET" \/>/a \    <uses-permission android:name="android.permission.CAMERA" \/>' android/app/src/main/AndroidManifest.xml

    - name: 🏗️ Compilar AAB (Tienda) y APK (Pruebas)
      run: |
        cd android
        chmod +x gradlew
        ./gradlew bundleRelease assembleRelease

    - name: 🔐 Firmar Archivo Oficial AAB (Para Google Play)
      env:
        KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      run: |
        echo "$KEYSTORE_BASE64" | tr -d '\n\r ' | base64 --decode > release.keystore
        jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 -keystore release.keystore -storepass $KEYSTORE_PASSWORD -keypass $KEY_PASSWORD android/app/build/outputs/bundle/release/app-release.aab $KEY_ALIAS

    - name: 📲 Alinear y Firmar APK (Firma v2/v3 para Android Moderno)
      env:
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      run: |
        BUILD_TOOLS=$(ls -d $ANDROID_HOME/build-tools/* | tail -1)
        $BUILD_TOOLS/zipalign -v -p 4 android/app/build/outputs/apk/release/app-release-unsigned.apk app-release-aligned.apk
        $BUILD_TOOLS/apksigner sign --ks release.keystore --ks-pass pass:$KEYSTORE_PASSWORD --key-pass pass:$KEY_PASSWORD --out ControlAsistencia.apk app-release-aligned.apk

    - name: 📤 Subir AAB Firmado (Para Google Play)
      uses: actions/upload-artifact@v4
      with:
        name: ControlAsistencia-GooglePlay-AAB
        path: android/app/build/outputs/bundle/release/app-release.aab

    - name: 📲 Subir APK Listo para Celular (Firma v2/v3)
      uses: actions/upload-artifact@v4
      with:
        name: ControlAsistencia-Celular-APK
        path: ControlAsistencia.apk
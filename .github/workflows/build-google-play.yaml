name: Construir App Oficial (Google Play AAB)

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: 📥 Clonar repositorio
      uses: actions/checkout@v4

    - name: ⚙️ Configurar Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: 📦 Instalar Motor Capacitor
      run: npm install

    - name: 🤖 Generar Proyecto Android
      run: |
        npx cap add android
        npx cap sync android

    - name: ☕ Configurar Java
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: 📷 Inyectar Permisos de Cámara
      run: |
        sed -i '/<uses-permission android:name="android.permission.INTERNET" \/>/a \    <uses-permission android:name="android.permission.CAMERA" \/>' android/app/src/main/AndroidManifest.xml

    - name: 🏗️ Compilar Android App Bundle (.aab)
      run: |
        cd android
        chmod +x gradlew
        ./gradlew bundleRelease

    - name: 🔐 Firmar el Archivo Oficial (Keystore)
      env:
        KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      run: |
        echo $KEYSTORE_BASE64 | base64 --decode > release.keystore
        jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 -keystore release.keystore -storepass $KEYSTORE_PASSWORD -keypass $KEY_PASSWORD android/app/build/outputs/bundle/release/app-release.aab $KEY_ALIAS

    - name: 📤 Subir Archivo Oficial (AAB) Firmado
      uses: actions/upload-artifact@v4
      with:
        name: ControlAsistencia-GooglePlay-AAB-FIRMADO
        path: android/app/build/outputs/bundle/release/app-release.aab
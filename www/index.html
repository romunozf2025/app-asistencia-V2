<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Control de Asistencia</title>

    <!-- LIBRERÍAS 100% OFFLINE (Locales) -->
    <script src="librerias/html5-qrcode.min.js" type="text/javascript"></script>
    <script src="librerias/jspdf.umd.min.js"></script>
    <script src="librerias/jspdf.plugin.autotable.min.js"></script>

    <style>
        :root {
            --bg-pastel: #fdfbf7; --primary-pastel: #a3c4f3; --secondary-pastel: #f1c0e8;
            --text-color: #4a4e69; --card-bg: #ffffff; --ok-bg: #d4edda;
            --ok-border: #c3e6cb; --ok-text: #155724; --error-bg: #f8d7da;
            --error-border: #f5c6cb; --error-text: #721c24; --warning-bg: #fff3cd;
            --warning-border: #ffeeba; --warning-text: #856404;
        }

        body {
            font-family: system-ui, -apple-system, sans-serif; margin: 0; padding: 0;
            background-color: var(--bg-pastel); color: var(--text-color);
            display: flex; flex-direction: column; min-height: 100vh;
            user-select: none; -webkit-user-select: none;
        }

        header {
            background-color: var(--card-bg); padding: 15px 20px; text-align: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05); border-bottom: 4px solid var(--primary-pastel);
        }
        header h2 { margin: 0; font-size: 1.4rem; }

        .contenedor-principal {
            flex: 1; display: flex; flex-direction: column; gap: 20px; padding: 20px;
            width: 100%; max-width: 700px; margin: 0 auto; box-sizing: border-box;
        }

        .panel-config, .panel {
            background-color: var(--card-bg); border-radius: 15px; padding: 20px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.06); text-align: center; display: flex;
            flex-direction: column; gap: 15px; align-items: center; width: 100%; box-sizing: border-box;
        }

        .panel-titulo { margin-top: 0; text-align: center; font-size: 1.1rem; margin-bottom: 15px; }

        .btn-descargar {
            display: inline-block; padding: 10px 20px; border-radius: 8px; font-weight: 600;
            cursor: pointer; transition: 0.3s; text-align: center; width: 100%;
            border: 2px solid; box-sizing: border-box; font-family: inherit; font-size: 0.95rem;
        }

        .btn-descargar:active { transform: scale(0.95); }

        /* Estilos de los contadores duales */
        .contador-caja {
            background-color: #f4f6f9; border-radius: 10px; padding: 15px;
            width: 100%; box-sizing: border-box; border-left: 5px solid var(--primary-pastel);
            margin-bottom: 5px; display: flex; justify-content: space-around;
        }
        .contador-bloque { text-align: center; }
        .contador-numero {
            font-size: 2.2rem; font-weight: bold; color: var(--text-color);
            margin: 5px 0 0 0; line-height: 1;
        }
        .contador-texto { margin: 0; font-size: 0.9rem; font-weight: 600; color: #6c757d; text-transform: uppercase; }

        #reader { width: 100%; border-radius: 8px; overflow: hidden; }

        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background-color: rgba(0, 0, 0, 0.6); backdrop-filter: blur(3px); 
            display: none; justify-content: center; align-items: center; z-index: 9999; 
        }

        .modal-content {
            background-color: var(--card-bg); width: 90%; max-width: 400px;
            border-radius: 15px; box-shadow: 0 15px 30px rgba(0,0,0,0.3);
            padding: 20px; animation: zoomIn 0.3s ease; 
        }

        @keyframes zoomIn { from { transform: scale(0.8); opacity: 0; } to { transform: scale(1); opacity: 1; } }

        #resultado-box { padding: 15px; border-radius: 8px; font-size: 1.1rem; font-weight: 600; text-align: center; margin-bottom: 10px; }

        .info-alumno {
            display: none; padding: 15px; background-color: #f4f6f9;
            border-radius: 10px; border-left: 5px solid var(--secondary-pastel);
        }
        .info-alumno p { margin: 8px 0; font-size: 0.95rem; }
        .info-alumno strong { color: var(--text-color); }

        .ok { background-color: var(--ok-bg); color: var(--ok-text); border: 1px solid var(--ok-border); }
        .vencido { background-color: var(--error-bg); color: var(--error-text); border: 1px solid var(--error-border); }
        .error { background-color: var(--warning-bg); color: var(--warning-text); border: 1px solid var(--warning-border); }

        .badge-estatus { display: inline-block; padding: 5px 12px; border-radius: 20px; font-weight: bold; font-size: 1rem; }
        .estatus-atiempo { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .estatus-retardo { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .estatus-salida { background-color: #e2e3e5; color: #383d41; border: 1px solid #d6d8db; }

        footer { text-align: center; padding: 15px; font-size: 0.85rem; color: #6c757d; background-color: var(--card-bg); border-top: 1px solid #e9ecef; margin-top: auto; }
    </style>
</head>
<body>

    <header>
        <h2>🎫 Control de Asistencia Institucional</h2>
    </header>

    <div class="contenedor-principal">
        <div class="panel-config">
            
            <!-- CONTADORES INTELIGENTES -->
            <div class="contador-caja">
                <div class="contador-bloque">
                    <p class="contador-texto">Asistencias Hoy</p>
                    <p class="contador-numero" id="contador-hoy">0</p>
                </div>
                <div class="contador-bloque" style="border-left: 2px solid #dee2e6; padding-left: 15px;">
                    <p class="contador-texto">Total en BD</p>
                    <p class="contador-numero" id="contador-bd">0</p>
                </div>
            </div>
            
            <div style="width: 100%; margin-top: 10px;">
                <p style="margin: 0 0 10px 0; font-size: 0.9rem; color: var(--text-color);"><strong>Exportar y Compartir Asistencias:</strong></p>
                <div style="display: flex; gap: 10px; justify-content: center; flex-wrap: wrap;">
                    <button id="btn-csv" class="btn-descargar" style="flex: 1; min-width: 130px; background-color: #d4edda; border-color: #c3e6cb; color: #155724;">📊 Archivo CSV</button>
                    <button id="btn-pdf" class="btn-descargar" style="flex: 1; min-width: 130px; background-color: #f8d7da; border-color: #f5c6cb; color: #721c24;">📄 Archivo PDF</button>
                </div>
            </div>
        </div>

        <div class="panel">
            <h3 class="panel-titulo">Escanear Credencial</h3>
            <div id="reader"></div>
        </div>
    </div>

    <!-- VENTANA FLOTANTE PARA RESULTADOS DEL ESCANER -->
    <div id="modal-overlay" class="modal-overlay">
        <div class="modal-content">
            <div id="resultado-box"></div>

            <div id="info-alumno" class="info-alumno">
                <p><strong>👤 Nombre:</strong> <span id="dato-nombre"></span></p>
                <p><strong>🎓 Grado/Grupo:</strong> <span id="dato-grado"></span></p>
                <p><strong>💼 Cargo:</strong> <span id="dato-cargo"></span></p>
                
                <hr style="border: 0; border-top: 1px solid #dee2e6; margin: 15px 0;">
                
                <p style="text-align: center; font-size: 1.1rem; margin-bottom: 5px; line-height: 1.5;">
                    <strong>📅 Fecha: <span id="dato-fecha-real" style="color: var(--text-color);"></span></strong><br>
                    <strong>⏰ Hora: <span id="dato-hora-real" style="color: var(--text-color);"></span></strong>
                </p>
                <div style="text-align: center; margin-top: 10px;">
                    <span id="dato-estatus" class="badge-estatus"></span>
                </div>
            </div>
        </div>
    </div>

    <footer>
        copyright Rodrigo A. Muñoz Fuentealba
    </footer>

    <script>
        let baseDeDatos = []; // Almacén histórico autogenerado
        let registrosDiarios = {}; // Asistencias del día
        let fechaMemoria = new Date().toDateString(); 
        let escaneoPausado = false;

        const modalOverlay = document.getElementById('modal-overlay');
        const resultadoBox = document.getElementById('resultado-box');
        const infoAlumnoBox = document.getElementById('info-alumno');

        window.onload = () => {
            // Cargar la BD histórica
            try {
                const bdGuardada = localStorage.getItem('institucionDB');
                if (bdGuardada) baseDeDatos = JSON.parse(bdGuardada);
            } catch (e) { baseDeDatos = []; }

            // Cargar las asistencias de hoy
            try {
                const registrosGuardados = localStorage.getItem('asistenciasHoy');
                const fechaGuardada = localStorage.getItem('fechaAsistencias');
                const hoyString = new Date().toDateString();
                
                if (registrosGuardados && fechaGuardada === hoyString) {
                    registrosDiarios = JSON.parse(registrosGuardados);
                    fechaMemoria = fechaGuardada;
                } else {
                    registrosDiarios = {};
                    fechaMemoria = hoyString;
                    localStorage.setItem('asistenciasHoy', JSON.stringify(registrosDiarios));
                    localStorage.setItem('fechaAsistencias', fechaMemoria);
                }
            } catch (e) { registrosDiarios = {}; }

            actualizarContadores();
            iniciarLector();
        };

        // ACTUALIZAR AMBOS CONTADORES
        function actualizarContadores() {
            document.getElementById('contador-hoy').innerText = Object.keys(registrosDiarios).length;
            document.getElementById('contador-bd').innerText = baseDeDatos.length;
        }

        // PROCESADOR INTELIGENTE DEL QR
        function procesarDatosQR(codigoLeido) {
            let datos = null;
            try { 
                datos = JSON.parse(codigoLeido); 
            } catch (e) {
                datos = {};
                let lineas = codigoLeido.split('\n');
                lineas.forEach(linea => {
                    let partes = linea.split(':');
                    if (partes.length >= 2) {
                        let clave = partes.shift().trim();
                        let valor = partes.join(':').trim();
                        if (clave) datos[clave] = valor;
                    }
                });
            }
            return (datos && Object.keys(datos).length > 0) ? datos : null;
        }

        function parsearFecha(texto) {
            if (!texto) return null;
            const limpio = texto.trim(); if (limpio === '') return null;
            let m = limpio.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);
            if (m) return new Date(Number(m[1]), Number(m[2]) - 1, Number(m[3]));
            m = limpio.match(/^(\d{1,2})[\/-](\d{1,2})[\/-](\d{4})$/);
            if (m) return new Date(Number(m[3]), Number(m[2]) - 1, Number(m[1]));
            const intento = new Date(limpio);
            return isNaN(intento.getTime()) ? null : intento;
        }

        function evaluarRetardo(horaOficial) {
            if (!horaOficial || horaOficial.trim() === "") return null; 
            let match = horaOficial.match(/(\d+):(\d+)\s*(AM|PM|am|pm)?/i);
            if (!match) return null;
            let horas = parseInt(match[1], 10); let minutos = parseInt(match[2], 10);
            let ampm = match[3] ? match[3].toUpperCase() : null;
            if (ampm === "PM" && horas < 12) horas += 12;
            if (ampm === "AM" && horas === 12) horas = 0;
            if (isNaN(horas) || isNaN(minutos) || horas < 0 || horas > 23 || minutos < 0 || minutos > 59) return null;

            let ahora = new Date(); let limite = new Date();
            limite.setHours(horas, minutos, 0, 0); limite.setMinutes(limite.getMinutes() + 15);
            return (ahora > limite) ? { texto: "⚠️ RETARDO", clase: "estatus-retardo" } : { texto: "✅ A TIEMPO", clase: "estatus-atiempo" };
        }

        function mostrarMensaje(estado, texto, usuario = null, horaReal = null, estatusObj = null, fechaReal = null) {
            resultadoBox.className = estado; resultadoBox.innerHTML = texto;
            if (usuario) {
                document.getElementById('dato-nombre').textContent = usuario.nombre;
                document.getElementById('dato-grado').textContent = usuario.gradoGrupo; 
                document.getElementById('dato-cargo').textContent = usuario.cargo;
                if (horaReal && fechaReal) {
                    document.getElementById('dato-fecha-real').textContent = fechaReal;
                    document.getElementById('dato-hora-real').textContent = horaReal;
                }
                const estatusSpan = document.getElementById('dato-estatus');
                if (estatusObj) {
                    estatusSpan.textContent = estatusObj.texto; estatusSpan.className = "badge-estatus " + estatusObj.clase;
                    estatusSpan.style.display = 'inline-block';
                } else { estatusSpan.style.display = 'none'; }
                infoAlumnoBox.style.display = 'block';
            } else { infoAlumnoBox.style.display = 'none'; }
            modalOverlay.style.display = 'flex'; 
        }

        function validarAcceso(codigoLeido) {
            const hoy = new Date(); const hoyString = hoy.toDateString();
            
            // Reiniciar asistencias si es un día nuevo
            if (hoyString !== fechaMemoria) {
                registrosDiarios = {}; fechaMemoria = hoyString;
                localStorage.setItem('asistenciasHoy', JSON.stringify(registrosDiarios));
                localStorage.setItem('fechaAsistencias', fechaMemoria);
                actualizarContadores();
            }

            let datosExtras = procesarDatosQR(codigoLeido);
            if (!datosExtras) {
                mostrarMensaje('error', '❌ QR no válido o vacío.'); 
                return;
            }

            // EXTRAER DATOS DEL QR
            let buscarClave = (claves) => {
                let keys = Object.keys(datosExtras);
                for (let cl of claves) {
                    let encontrada = keys.find(k => k.toLowerCase() === cl.toLowerCase());
                    if (encontrada) return datosExtras[encontrada];
                }
                return "";
            };

            let nombre = buscarClave(["Nombre", "Nombre Completo", "Alumno"]) || "Desconocido";
            let codigoUnico = buscarClave(["ID", "Matrícula", "Matricula", "Folio"]) || nombre; 
            let gradoGrupo = buscarClave(["Grado", "Curso", "Grupo", "Grado/Grupo"]) || "N/A";
            let cargo = buscarClave(["Cargo", "Rol", "Tipo"]) || "Alumno";
            let vigencia = buscarClave(["Vigencia", "Vencimiento", "Caducidad"]);
            let ingresoOficial = buscarClave(["Ingreso", "Hora Ingreso", "Entrada"]); 

            let usuario = { id: codigoUnico, nombre: nombre, gradoGrupo: gradoGrupo, cargo: cargo, ingreso: ingresoOficial };

            // ALIMENTAR LA BASE DE DATOS AUTOMÁTICAMENTE
            let indexExistente = baseDeDatos.findIndex(u => u.id === codigoUnico);
            if (indexExistente === -1) {
                baseDeDatos.push(usuario); // Es nuevo, lo agregamos
            } else {
                baseDeDatos[indexExistente] = usuario; // Ya existe, actualizamos sus datos por si cambiaron de grado
            }
            localStorage.setItem('institucionDB', JSON.stringify(baseDeDatos));

            const fechaFormatStr = hoy.toLocaleDateString('es-ES', { day: '2-digit', month: '2-digit', year: 'numeric' });
            const horaActualStr = hoy.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
            const timestampActual = Date.now();
            const hoyComprobacion = new Date(); hoyComprobacion.setHours(0, 0, 0, 0);

            // Validar vigencia
            if (vigencia) {
                const fechaVencimiento = parsearFecha(vigencia);
                if (fechaVencimiento) {
                    fechaVencimiento.setHours(0, 0, 0, 0);
                    if (hoyComprobacion > fechaVencimiento) {
                        mostrarMensaje('vencido', `🚨 ACCESO DENEGADO<br><small>Credencial vencida el ${vigencia}</small>`, usuario, null, null, null); 
                        actualizarContadores();
                        return;
                    }
                }
            }

            let estadoActual = registrosDiarios[codigoUnico];
            
            if (!estadoActual) {
                // PRIMER ESCANEO (INGRESO)
                let estatusCalculado = evaluarRetardo(usuario.ingreso) || { texto: "✅ INGRESADO", clase: "estatus-atiempo" };
                
                registrosDiarios[codigoUnico] = { 
                    usuario: usuario,
                    estado: 'ingreso', 
                    fecha: fechaFormatStr, 
                    horaIngreso: horaActualStr, 
                    horaSalida: '---', 
                    timestamp: timestampActual 
                };
                
                localStorage.setItem('asistenciasHoy', JSON.stringify(registrosDiarios)); 
                actualizarContadores();
                mostrarMensaje('ok', `INGRESO REGISTRADO`, usuario, horaActualStr, estatusCalculado, fechaFormatStr);
                
            } else if (estadoActual.estado === 'ingreso') {
                // SEGUNDO ESCANEO (SALIDA)
                const minutosBloqueo = 5; 
                const tiempoTranscurrido = timestampActual - (estadoActual.timestamp || 0);
                if (tiempoTranscurrido < (minutosBloqueo * 60 * 1000)) {
                    const minutosRestantes = Math.ceil((minutosBloqueo * 60 * 1000 - tiempoTranscurrido) / 60000);
                    mostrarMensaje('error', `⚠️ ENTRADA YA REGISTRADA<br><small>Espera ${minutosRestantes} min. antes de registrar tu salida.</small>`, usuario, horaActualStr, null, fechaFormatStr);
                } else {
                    registrosDiarios[codigoUnico].estado = 'salida'; 
                    registrosDiarios[codigoUnico].horaSalida = horaActualStr; 
                    registrosDiarios[codigoUnico].timestamp = timestampActual;
                    
                    localStorage.setItem('asistenciasHoy', JSON.stringify(registrosDiarios)); 
                    actualizarContadores(); 
                    mostrarMensaje('ok', `SALIDA REGISTRADA`, usuario, horaActualStr, { texto: "🚪 SALIDA", clase: "estatus-salida" }, fechaFormatStr);
                }
            } else {
                mostrarMensaje('error', `⚠️ REGISTRO DUPLICADO<br><small>Ya registró su salida hoy.</small>`, usuario, horaActualStr, null, fechaFormatStr);
            }
        }

        // ============================================================================
        // MOTOR DE EXPORTACIÓN NATIVO (CSV Y PDF) 
        // ============================================================================
        async function compartirArchivoNativo(blob, fileName) {
            try {
                if (window.Capacitor && window.Capacitor.isNative) {
                    const base64Data = await new Promise((resolve, reject) => {
                        const reader = new FileReader(); reader.onerror = reject;
                        reader.onload = () => resolve(reader.result.split(',')[1]);
                        reader.readAsDataURL(blob);
                    });
                    const Filesystem = window.Capacitor.Plugins.Filesystem;
                    const Share = window.Capacitor.Plugins.Share;
                    const writeResult = await Filesystem.writeFile({ path: fileName, data: base64Data, directory: 'CACHE' });
                    await Share.share({
                        title: 'Reporte de Asistencia',
                        text: `Adjunto el reporte de asistencia en formato ${fileName.split('.').pop().toUpperCase()}.`,
                        url: writeResult.uri, dialogTitle: 'Compartir Reporte'
                    });
                } else {
                    const file = new File([blob], fileName, { type: blob.type });
                    if (navigator.canShare && navigator.canShare({ files: [file] })) {
                        await navigator.share({ title: 'Reporte de Asistencia', files: [file] });
                    } else {
                        const url = URL.createObjectURL(blob); const a = document.createElement("a");
                        a.href = url; a.download = fileName; document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url);
                    }
                }
            } catch (err) { alert("Hubo un error al intentar compartir el archivo."); }
        }

        // EXPORTAR CSV
        document.getElementById('btn-csv').addEventListener('click', async () => {
            if (Object.keys(registrosDiarios).length === 0) return alert('No hay registros de asistencia.');
            const btn = document.getElementById('btn-csv'); const textoOriginal = btn.innerText; btn.innerText = "⌛ Procesando...";

            let csvContent = "ID,Nombre,Grado/Grupo,Cargo,Fecha,Hora Ingreso,Hora Salida\n";
            for (const codigo in registrosDiarios) {
                const r = registrosDiarios[codigo];
                const u = r.usuario;
                const fechaRegistro = r.fecha || new Date().toLocaleDateString('es-ES');
                csvContent += `"${u.id}","${u.nombre}","${u.gradoGrupo}","${u.cargo}","${fechaRegistro}","${r.horaIngreso}","${r.horaSalida}"\n`;
            }
            const bom = new Uint8Array([0xEF, 0xBB, 0xBF]);
            const blob = new Blob([bom, csvContent], { type: 'text/csv;charset=utf-8;' });
            const fileName = `Asistencia_${new Date().toISOString().split('T')[0]}.csv`;
            
            await compartirArchivoNativo(blob, fileName);
            btn.innerText = textoOriginal;
        });

        // EXPORTAR PDF
        document.getElementById('btn-pdf').addEventListener('click', async () => {
            if (Object.keys(registrosDiarios).length === 0) return alert('No hay registros de asistencia.');
            if (!window.jspdf) return alert('Librería PDF no cargada.');
            
            const btn = document.getElementById('btn-pdf'); const textoOriginal = btn.innerText; btn.innerText = "⌛ Procesando...";
            
            const { jsPDF } = window.jspdf; const doc = new jsPDF();
            doc.setFontSize(16); doc.text("Reporte de Asistencia Institucional", 14, 15);
            doc.setFontSize(10); doc.setTextColor(100); doc.text(`Fecha de Emisión: ${new Date().toLocaleDateString()}`, 14, 22);

            const bodyData = [];
            for (const codigo in registrosDiarios) {
                const r = registrosDiarios[codigo];
                const u = r.usuario;
                const fechaRegistro = r.fecha || new Date().toLocaleDateString('es-ES');
                bodyData.push([u.id, u.nombre, u.gradoGrupo, u.cargo, fechaRegistro, r.horaIngreso, r.horaSalida]);
            }
            doc.autoTable({
                startY: 28, head: [['ID', 'Nombre', 'Grado/Grupo', 'Cargo', 'Fecha', 'Ingreso', 'Salida']],
                body: bodyData, theme: 'striped', styles: { fontSize: 8 }, headStyles: { fillColor: [163, 196, 243] } 
            });

            const pdfBuffer = doc.output('arraybuffer');
            const blob = new Blob([pdfBuffer], { type: 'application/pdf' });
            const fileName = `Asistencia_${new Date().toISOString().split('T')[0]}.pdf`;
            
            await compartirArchivoNativo(blob, fileName);
            btn.innerText = textoOriginal;
        });

        function onScanSuccess(decodedText) {
            if (escaneoPausado) return; escaneoPausado = true;
            validarAcceso(decodedText);
            
            setTimeout(() => {
                infoAlumnoBox.style.display = 'none'; resultadoBox.className = 'ok'; resultadoBox.innerHTML = '🔄 Siguiente credencial...';
                setTimeout(() => { modalOverlay.style.display = 'none'; escaneoPausado = false; }, 1500); 
            }, 3000); 
        }

        function onScanFailure() {}

        function iniciarLector() {
            if (typeof Html5QrcodeScanner === 'undefined') return;
            try {
                const html5QrcodeScanner = new Html5QrcodeScanner("reader", { fps: 10, qrbox: { width: 250, height: 250 } }, false);
                html5QrcodeScanner.render(onScanSuccess, onScanFailure);
            } catch (e) {}
        }
    </script>
</body>
</html>
